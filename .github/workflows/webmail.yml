name: Daily Webmail Scraper (Once a Day)

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC (6:30 AM IST)
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  webmail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv google-genai

      - name: Run Webmail Scraper
        env:
          KERBEROS_ID: ${{ secrets.KERBEROS_ID }}
          KERBEROS_PASS: ${{ secrets.KERBEROS_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAP_SERVER: "imap.iitd.ac.in"
          IMAP_PORT: "993"
        run: |
          python scraper/webmail_scraper.py

      - name: Commit and push updated overrides.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add public/overrides.json bot/overrides.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update webmail overrides [skip ci]" && git push)
