name: Periodic Moodle Scraper

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          MOODLE_SESSION: ${{ secrets.MOODLE_SESSION }}
          MOODLENEW_SESSION: ${{ secrets.MOODLE_SESSION }}
          MOODLENEW_SESSION_VAL: ${{ secrets.MOODLENEW_SESSION }}
        run: |
          python scraper/scrape.py

      - name: Commit and push updated data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add public/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update moodle data [skip ci]" && git push)
