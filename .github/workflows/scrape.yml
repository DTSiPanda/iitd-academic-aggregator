name: Moodle Scraper (Every 3 Hours)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv
          playwright install --with-deps chromium

      - name: Run Moodle Scraper
        env:
          MOODLE_SESSION: ${{ secrets.MOODLE_SESSION }}
          MOODLENEW_SESSION: ${{ secrets.MOODLENEW_SESSION }}
          KERBEROS_ID: ${{ secrets.KERBEROS_ID }}
          KERBEROS_PASS: ${{ secrets.KERBEROS_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scraper/scrape.py

      - name: Commit and push updated data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add public/data.json public/files/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update moodle data & downloaded files [skip ci]" && git push)
